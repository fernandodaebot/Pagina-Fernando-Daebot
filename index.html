<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0b0b0b;
  color:white;
}

/* NAV */
.nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:12px 40px;
  background:rgba(0,0,0,0.6);
}

.menu a{
  margin:0 10px;
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:120px 80px;

  background:
  linear-gradient(to right, rgba(0,0,0,0.6), rgba(0,0,0,0.2)),
  url("https://raw.githubusercontent.com/fernandodaebot/Pagina-Fernando-Daebot/main/fondo.png");

  background-size:cover;
}

.btn-main{
  background:red;
  padding:12px 20px;
  border:none;
  color:white;
  cursor:pointer;
}

/* REDES */
.stats{
  background:#000;
  padding:60px;
  display:flex;
  justify-content:center;
  gap:20px;
}

.stat-box{
  background:#222;
  padding:20px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
}

.num{
  font-size:30px;
  color:red;
}

/* CATALOGO */
.catalogo{
  padding:60px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#111;
  border-radius:10px;
  padding:10px;
}

.card img{
  width:100%;
}

.detalles{
  display:none;
}

.carrito{
  margin-top:30px;
  background:#222;
  padding:20px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Daebot 🤖</h2>
  <div class="menu">
    <a href="#inicio">Inicio</a>
    <a href="#redes">Redes</a>
    <a href="#catalogo">Catálogo</a>
  </div>
</div>

<!-- HERO -->
<section class="hero" id="inicio">
  <div>
    <h1>Moldes de <span style="color:red">Goma Eva</span></h1>
    <button class="btn-main" onclick="window.location.href='jonson/index.html'">
      Ver Catálogo
    </button>
  </div>
</section>

<!-- REDES -->
<section class="stats" id="redes">

<div class="stat-box" onclick="abrir('https://www.tiktok.com/@fernandodaebot')">
  <div class="num" id="tiktok">0</div>
  <p>TikTok</p>
</div>

<div class="stat-box" onclick="abrir('https://www.facebook.com/fernando.daebot')">
  <div class="num" id="facebook">0</div>
  <p>Facebook</p>
</div>

<div class="stat-box" onclick="abrir('https://www.youtube.com/@FernandoDaebot')">
  <div class="num" id="youtube">0</div>
  <p>YouTube</p>
</div>

<div class="stat-box" onclick="abrir('https://www.instagram.com/fernando_daebot')">
  <div class="num" id="instagram">0</div>
  <p>Instagram</p>
</div>

</section>

<!-- CATALOGO -->
<section class="catalogo" id="catalogo">

<h2>Catálogo</h2>

<div id="filtros"></div>
<div id="productos" class="grid"></div>

<div class="carrito">
  <h3>Tu pedido</h3>
  <ul id="listaCarrito"></ul>
  <p>Total: <span id="total">0</span> Bs</p>
</div>

</section>

<script>

/* LINKS */
function abrir(url){
  window.open(url, "_blank");
}

/* CONTADOR REDES */
const datos = {
  tiktok:18000,
  facebook:3000,
  youtube:630,
  instagram:42
};

function formatear(n){
  return n>=1000 ? (n/1000).toFixed(0)+"K" : n;
}

for(let red in datos){
  let el = document.getElementById(red);
  let val = datos[red];
  let c=0;

  let i=setInterval(()=>{
    c+=val/50;
    if(c>=val){c=val;clearInterval(i);}
    el.innerText="+"+formatear(Math.floor(c));
  },20);
}

/* CATALOGO */
let carrito=[];

fetch("jonson/productos.json")
.then(r=>r.json())
.then(data=>{

  let filtros=document.getElementById("filtros");
  let cats=["Todos",...new Set(data.map(p=>p.categoria))];

  cats.forEach(c=>{
    let b=document.createElement("button");
    b.innerText=c;
    b.onclick=()=>mostrar(c,data);
    filtros.appendChild(b);
  });

  mostrar("Todos",data);
});

function mostrar(cat,data){
  let cont=document.getElementById("productos");
  cont.innerHTML="";

  data.filter(p=>cat==="Todos"||p.categoria===cat)
  .forEach((p,i)=>{

    let opciones=p.opciones||[
      {nombre:"5cm",precio:15},
      {nombre:"7cm",precio:30},
      {nombre:"Kit",precio:120}
    ];

    let html="";
    opciones.forEach(o=>{
      html+=`<div>${o.nombre} - ${o.precio}Bs
      <button onclick="add('${p.nombre}','${o.nombre}',${o.precio})">+</button></div>`;
    });

    cont.innerHTML+=`
    <div class="card">
      <img src="${p.imagen}">
      <h4>${p.nombre}</h4>
      <button onclick="toggle(${i})">Ver</button>
      <div class="detalles" id="d${i}">${html}</div>
    </div>`;
  });
}

function toggle(i){
  let d=document.getElementById("d"+i);
  d.style.display=d.style.display==="block"?"none":"block";
}

function add(n,o,p){
  carrito.push({n,o,p});
  render();
}

function render(){
  let l=document.getElementById("listaCarrito");
  let t=document.getElementById("total");

  l.innerHTML="";
  let s=0;

  carrito.forEach((x,i)=>{
    s+=x.p;
    l.innerHTML+=`<li>${x.n} (${x.o}) - ${x.p}
    <button onclick="del(${i})">x</button></li>`;
  });

  t.innerText=s;
}

function del(i){
  carrito.splice(i,1);
  render();
}

</script>

</body>
</html>
