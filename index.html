<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>
  .card{
  background:#111;
  border-radius:12px;
  padding:15px;
  text-align:center;
  transition:0.3s;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.card img{
  width:100%;
  border-radius:10px;
}

.card h3{
  margin:10px 0;
  font-weight:bold;
}

/* 🔥 EXPANSIÓN */
.expandir{
  display:none;
  margin-top:10px;
  text-align:left;
}

.fila{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:5px 0;
}

.fila button{
  background:red;
  border:none;
  color:white;
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
}

.titulo{
  color:red;
  font-weight:bold;
}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0b0b0b;
  color:white;
  /* 🔥 TITULO CATALOGO */
.catalogo h2{
  font-size:40px;
  margin-bottom:10px;
}

.catalogo p{
  color:#aaa;
  margin-bottom:30px;
}

/* 🔥 BOTONES CATEGORIAS */
#filtros{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

#filtros button{
  background:#1f1f1f;
  border:none;
  padding:10px 18px;
  border-radius:20px;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

#filtros button:hover{
  background:red;
}

#filtros button.active{
  background:red;
}

/* 🔥 TARJETAS PRO */
.card{
  background:#111;
  border-radius:15px;
  padding:15px;
  text-align:left;
  transition:0.3s;
  border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

.card img{
  height:160px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

/* 🔥 TEXTO TARJETA */
.card h4{
  margin:5px 0;
}

.precio{
  color:red;
  font-weight:bold;
  margin:10px 0;
}

/* 🔥 BOTON */
.card button{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #333;
  background:transparent;
  color:white;
  cursor:pointer;
}

.card button:hover{
  border-color:red;
}
}

/* NAV */
.nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 40px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

.menu{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:25px;
}

.menu a{
  position:relative;
  color:white;
  text-decoration:none;
  font-weight:800;
}

/* línea animada */
.menu a::after{
  content:"";
  position:absolute;
  bottom:-5px;
  left:0;
  width:0%;
  height:3px;
  background:red;
  transition:0.3s;
}

.menu a:hover::after,
.menu a.active::after{
  width:100%;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:120px 80px;
  background:
  linear-gradient(to right, rgba(0,0,0,0.6), rgba(0,0,0,0.2)),
  url("https://raw.githubusercontent.com/fernandodaebot/Pagina-Fernando-Daebot/main/fondo.png");
  background-size:cover;
}

.hero h1{
  font-size:65px;
  font-weight:900;
  margin:0;
}

.hero p{
  color:#ccc;
  margin-top:20px;
  font-size:18px;
}

.btn-main{
  background:red;
  padding:14px 24px;
  border:none;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

/* REDES */
.stats{
  background:#000;
  padding:60px;
  display:flex;
  justify-content:center;
  gap:20px;
}

.stat-box{
  background:#222;
  padding:20px;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
  transition:0.3s;
}

.stat-box:hover{
  transform:scale(1.05);
}

.num{
  font-size:32px;
  color:red;
  font-weight:bold;
}

/* CATALOGO */
.catalogo{
  padding:60px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#111;
  border-radius:10px;
  padding:10px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
}

.detalles{
  display:none;
  margin-top:10px;
}

.carrito{
  margin-top:30px;
  background:#222;
  padding:20px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Daebot 🤖</h2>
  <div class="menu">
    <a href="#inicio">Inicio</a>
    <a href="#redes">Redes</a>
    <a href="#catalogo">Catálogo</a>
  </div>
</div>

<!-- HERO -->
<section class="hero" id="inicio">
  <div>
    <h1>Moldes de <span style="color:red">Goma Eva</span></h1>
    <p>Crea fofuchas, figuras y manualidades increíbles 🚀</p>

    <button class="btn-main" onclick="window.location.href='jonson/index.html'">
      Ver Catálogo
    </button>
  </div>
</section>

<!-- REDES -->
<section class="stats" id="redes">

<div class="stat-box" onclick="abrir('https://www.tiktok.com/@fernandodaebot')">
  <div class="num" id="tiktok">0</div>
  <p>TikTok</p>
</div>

<div class="stat-box" onclick="abrir('https://www.facebook.com/fernando.daebot')">
  <div class="num" id="facebook">0</div>
  <p>Facebook</p>
</div>

<div class="stat-box" onclick="abrir('https://www.youtube.com/@FernandoDaebot')">
  <div class="num" id="youtube">0</div>
  <p>YouTube</p>
</div>

<div class="stat-box" onclick="abrir('https://www.instagram.com/fernando_daebot')">
  <div class="num" id="instagram">0</div>
  <p>Instagram</p>
</div>

</section>

<!-- CATALOGO -->
<section class="catalogo" id="catalogo">

<h2>Catálogo de Termoformas</h2>
<p>Encuentra moldes, kits y accesorios para tus proyectos</p>

<div id="filtros"></div>
<div id="productos" class="grid"></div>

<div class="carrito">
  <h3>Tu pedido</h3>
  <ul id="listaCarrito"></ul>
  <p>Total: <span id="total">0</span> Bs</p>
</div>

</section>

<script>

let carrito = [];

/* 🔥 CARGAR PRODUCTOS */
fetch("jonson/productos.json")
.then(res => res.json())
.then(data => mostrarProductos(data));

function mostrarProductos(lista){
  const contenedor = document.getElementById("productos");
  contenedor.innerHTML = "";

  lista.forEach((p,i)=>{

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${p.imagen}">
      <h3>${p.nombre}</h3>

      <div class="expandir" id="det${i}">
        
        <p class="titulo">Precio Por Suelto 🌸</p>

        <div class="fila">
          Alto 8 cm a 35 Bs
          <button onclick="agregar('${p.nombre}','8cm',35)">Comprar</button>
        </div>

        <div class="fila">
          Alto 6 cm a 23 Bs
          <button onclick="agregar('${p.nombre}','6cm',23)">Comprar</button>
        </div>

        <div class="fila">
          Alto 4 cm a 13 Bs
          <button onclick="agregar('${p.nombre}','4cm',13)">Comprar</button>
        </div>

        <hr>

        <p class="titulo">Precio Kit (3 tamaños)</p>

        <div class="fila">
          1 Kit: 65 Bs
          <button onclick="agregar('${p.nombre}','Kit 1',65)">Comprar</button>
        </div>

        <div class="fila">
          3 Kits: 60 Bs
          <button onclick="agregar('${p.nombre}','Kit x3',60)">Comprar</button>
        </div>

        <div class="fila">
          6 Kits: 55 Bs
          <button onclick="agregar('${p.nombre}','Kit x6',55)">Comprar</button>
        </div>

      </div>
    `;

    card.onclick = ()=>toggle(i);

    contenedor.appendChild(card);
  });
}

/* 🔽 EXPANDIR */
function toggle(id){
  let d = document.getElementById("det"+id);
  d.style.display = d.style.display === "block" ? "none" : "block";
}

/* 🛒 CARRITO */
function agregar(nombre, opcion, precio){
  carrito.push({nombre, opcion, precio});
  actualizarCarrito();
}

function actualizarCarrito(){
  let lista = document.getElementById("listaCarrito");
  let total = document.getElementById("total");

  lista.innerHTML = "";
  let suma = 0;

  carrito.forEach((item, i)=>{
    suma += item.precio;

    lista.innerHTML += `
      <li>
        ${item.nombre} (${item.opcion}) - ${item.precio} Bs
      </li>
    `;
  });

  total.innerText = suma;
}

/* 🔗 REDES */
function abrir(url){
  window.open(url, "_blank");
}

/* 🔥 CONTADOR ANIMADO */
const datos = {
  tiktok:18000,
  facebook:3000,
  youtube:630,
  instagram:42
};

function formatear(n){
  return n>=1000 ? (n/1000).toFixed(0)+"K" : n;
}

window.onload = ()=>{
  for(let red in datos){
    let el = document.getElementById(red);
    if(!el) continue;

    let val = datos[red];
    let c = 0;

    let i = setInterval(()=>{
      c += val/40;

      if(c >= val){
        c = val;
        clearInterval(i);
      }

      el.innerText = "+" + formatear(Math.floor(c));
    },20);
  }
};

</script>

</body>
</html>
