<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>

/* GENERAL */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to bottom, #0b0b0b, #000);
  color: white;
  padding-top: 70px;
}

/* NAVBAR */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 40px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  z-index: 1000;
}

/* MENU */
.menu a {
  margin-left: 30px;
  text-decoration: none;
  color: #ccc;
  font-size: 18px;
  font-weight: bold;
  position: relative;
}

.menu a:hover {
  color: white;
}

/* LINEA ROJA */
.menu a::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 0%;
  height: 2px;
  background: red;
  transition: 0.3s;
}

.menu a:hover::after,
.menu a.active::after {
  width: 100%;
}

.menu a.active {
  color: white;
}

/* HERO PRO */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 80px;
  gap: 40px;
}

/* TEXTO */
.hero-text {
  max-width: 50%;
}

.hero-text h1 {
  font-size: 70px;
  margin: 0;
}

.hero-text span {
  color: red;
}

.hero-text p {
  color: #aaa;
  margin-top: 20px;
  font-size: 18px;
}

/* BOTONES */
.buttons {
  margin-top: 30px;
}

.btn-main {
  background: red;
  color: white;
  padding: 14px 26px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.btn-main:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px red;
}

.btn-secondary {
  background: transparent;
  border: 1px solid #444;
  color: white;
  padding: 14px 26px;
  border-radius: 10px;
  margin-left: 10px;
  cursor: pointer;
}

/* VIDEO */
.hero-video {
  width: 500px;
  height: 280px;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

.hero-video iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* REDES */
.stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px;
  flex-wrap: wrap;
}

.stat-box {
  background: #2a2a2a;
  padding: 18px 10px;
  border-radius: 12px;
  width: 140px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
}

.stat-box:hover {
  background: #3a3a3a;
  transform: scale(1.05);
}

.stat-box p {
  font-size: 20px;
  font-weight: bold;
}

.num {
  font-size: 42px;
  color: red;
  font-weight: bold;
}

/* PRODUCTOS */
.productos {
  background: white;
  color: black;
  padding: 50px;
  text-align: center;
}

.card {
  background: #eee;
  padding: 20px;
  margin: 10px;
  display: inline-block;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Daebot 🤖</h2>
  <div class="menu">
    <a href="#inicio" class="active">Inicio</a>
    <a href="#redes">Redes</a>
    <a href="#catalogo">Catálogo</a>
  </div>
</div>

<!-- HERO PRO -->
<section class="hero" id="inicio">

  <div class="hero-text">
    <h1>Impresión 3D <br><span>de principio a fin</span></h1>

    <p>
      Cursos, diseños STL y comunidad para creadores 🚀  
      Aprende desde cero y domina tus proyectos.
    </p>

    <div class="buttons">
      <button class="btn-main">Comenzar Gratis</button>
      <button class="btn-secondary">Ver contenido</button>
    </div>
  </div>

  <div class="hero-video">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
  </div>

</section>

<!-- REDES -->
<section class="stats" id="redes">

  <div class="stat-box" onclick="abrir('https://www.tiktok.com/@fernandodaebot')">
    <div class="num" id="tiktok">0</div>
    <p>TikTok</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.facebook.com/fernando.daebot')">
    <div class="num" id="facebook">0</div>
    <p>Facebook</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.youtube.com/@FernandoDaebot')">
    <div class="num" id="youtube">0</div>
    <p>YouTube</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.instagram.com/fernando_daebot/')">
    <div class="num" id="instagram">0</div>
    <p>Instagram</p>
  </div>

</section>

<!-- PRODUCTOS -->
<section class="productos" id="catalogo">
  <h2>Catálogo</h2>

  <div class="card">
    Hombre 5cm - 15 Bs
    <button onclick="add('Hombre 5cm',15)">Agregar</button>
  </div>

  <div class="card">
    Mujer 5cm - 15 Bs
    <button onclick="add('Mujer 5cm',15)">Agregar</button>
  </div>

</section>

<script>

/* SCROLL NAV */
window.addEventListener("scroll", () => {
  const nav = document.querySelector(".nav");
  nav.style.background = window.scrollY > 50 
    ? "rgba(0,0,0,0.85)" 
    : "rgba(0,0,0,0.6)";
});

/* MENU ACTIVO */
const sections = document.querySelectorAll("section");
const navLinks = document.querySelectorAll(".menu a");

window.addEventListener("scroll", () => {
  let current = "";

  sections.forEach(section => {
    if (pageYOffset >= section.offsetTop - 100) {
      current = section.id;
    }
  });

  navLinks.forEach(a => {
    a.classList.remove("active");
    if (a.getAttribute("href") === "#" + current) {
      a.classList.add("active");
    }
  });
});

/* LINKS */
function abrir(url){
  window.open(url, "_blank");
}

/* DATOS */
const datos = {
  "tiktok": 18000,
  "facebook": 3000,
  "youtube": 630,
  "instagram": 42
};

function formatear(num) {
  return num >= 1000 ? (num/1000).toFixed(0)+"K" : num;
}

/* ANIMACIÓN */
for (let red in datos) {
  let el = document.getElementById(red);
  let valor = datos[red];
  let count = 0;

  let subir = setInterval(() => {
    count += valor / 50;
    if (count >= valor) {
      count = valor;
      clearInterval(subir);
    }
    el.innerText = "+" + formatear(Math.floor(count));
  }, 20);
}

</script>

</body>
</html>
