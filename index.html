<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>

/* BOTÓN PEDIDO */
.btn-pedido{
  background: linear-gradient(45deg, red, #ff3c3c);
  color:white !important;
  padding:12px 22px;
  border-radius:12px;
  font-weight:900;
  font-size:20px;
  transition:0.3s;
}

.btn-pedido:hover{
  transform:scale(1.08);
  background:#ff1a1a;
}

/* BODY */
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0b0b0b;
  color:white;
}

/* NAV */
.nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:12px 40px;
  background:rgba(0,0,0,0.6);
  z-index:9999;
}

.menu{
  display:flex;
  gap:20px;
}

.menu a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  padding:120px 80px;
  background:url("https://raw.githubusercontent.com/fernandodaebot/Pagina-Fernando-Daebot/main/fondo.png");
  background-size:cover;
}

.btn-main{
  background:red;
  padding:12px 20px;
  border:none;
  color:white;
  cursor:pointer;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#111;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-contenido{
  background:#111;
  padding:20px;
  border-radius:10px;
  display:flex;
  gap:20px;
}

.popup img{
  width:250px;
}

.cerrar{
  position:absolute;
  right:20px;
  top:10px;
  cursor:pointer;
}

/* CARRITO */
.carrito{
  background:#181818;
  padding:20px;
  margin-top:30px;
}

.item{
  background:#222;
  padding:10px;
  margin-bottom:10px;
}

/* BOTONES */
button{
  cursor:pointer;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Daebot 🤖</h2>
  <div class="menu">
    <a href="#catalogo">Catálogo</a>
    <a href="#pedido" class="btn-pedido">🛒 Pedido</a>
  </div>
</div>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Moldes de <span style="color:red">Goma Eva</span></h1>
    <button class="btn-main">Ver Catálogo</button>
  </div>
</section>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-contenido">
    <span class="cerrar" onclick="cerrarPopup()">✖</span>
    <img id="popupImg">
    <div id="popupInfo"></div>
  </div>
</div>

<!-- CATALOGO -->
<section id="catalogo">
  <h2>Catálogo</h2>
  <div id="productos" class="grid"></div>

  <div class="carrito" id="pedido">
    <h2>🛒 Pedido</h2>
    <div id="lista"></div>
    <h3>Total: <span id="total">0</span> Bs</h3>
  </div>
</section>

<script>

let carrito = [];

/* PRODUCTOS EJEMPLO */
const productos = [
  {nombre:"Molde Goku", imagen:"https://via.placeholder.com/200"},
  {nombre:"Molde Naruto", imagen:"https://via.placeholder.com/200"}
];

/* MOSTRAR */
function mostrar(){
  let cont = document.getElementById("productos");

  productos.forEach(p=>{
    let card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <img src="${p.imagen}">
      <h3>${p.nombre}</h3>
    `;

    card.onclick = ()=>abrirPopup(p);

    cont.appendChild(card);
  });
}

mostrar();

/* POPUP */
function abrirPopup(p){
  document.getElementById("popup").style.display="flex";
  document.getElementById("popupImg").src = p.imagen;

  document.getElementById("popupInfo").innerHTML = `
    <h2>${p.nombre}</h2>
    <button onclick="agregar('${p.nombre}',35)">Comprar 35 Bs</button>
  `;
}

function cerrarPopup(){
  document.getElementById("popup").style.display="none";
}

/* CARRITO */
function agregar(nombre, precio){
  carrito.push({nombre,precio});
  actualizar();
}

function actualizar(){
  let lista = document.getElementById("lista");
  let total = document.getElementById("total");

  lista.innerHTML="";
  let suma=0;

  carrito.forEach(p=>{
    lista.innerHTML += `<div class="item">${p.nombre} - ${p.precio} Bs</div>`;
    suma += p.precio;
  });

  total.innerText = suma;
}

</script>

</body>
</html>
