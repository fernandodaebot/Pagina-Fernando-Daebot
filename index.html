<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0b0b0b;
  color: white;
}

/* NAV */
.nav {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-between;
  padding: 20px 60px;
  background: #000;
}

.menu a {
  margin-left: 20px;
  text-decoration: none;
  color: white;
}

.menu a:hover {
  color: red;
}

/* HERO */
.hero {
  display: flex;
  justify-content: space-between;
  padding: 80px;
}

.hero-text h1 {
  font-size: 60px;
}

.hero-text span {
  color: red;
}

/* REDES */
.stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px;
}

.stat-box {
  background: #2a2a2a;
  padding: 30px;
  border-radius: 15px;
  width: 150px;
  text-align: center;
  cursor: pointer;
}

.stat-box:hover {
  background: #3a3a3a;
}

.num {
  font-size: 35px;
  color: red;
  font-weight: bold;
}

/* PRODUCTOS */
.productos {
  background: white;
  color: black;
  padding: 50px;
}

.card {
  background: #eee;
  padding: 20px;
  margin: 10px;
  display: inline-block;
}

/* CARRITO */
.carrito {
  padding: 40px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Daebot 🤖</h2>
  <div class="menu">
    <a href="#inicio">Inicio</a>
    <a href="#redes">Redes</a>
    <a href="#catalogo">Catálogo</a>
  </div>
</div>

<!-- HERO -->
<section class="hero" id="inicio">
  <div class="hero-text">
    <h1>Fernando <span>Daebot</span></h1>
    <p>Creador de termoformas 🚀</p>
  </div>
</section>

<!-- REDES -->
<section class="stats" id="redes">

  <div class="stat-box" onclick="abrir('https://www.tiktok.com/@fernandodaebot')">
    <div class="num" id="tiktok">0</div>
    <p>TikTok</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.facebook.com/fernando.daebot')">
    <div class="num" id="facebook">0</div>
    <p>Facebook</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.youtube.com/@FernandoDaebot')">
    <div class="num" id="youtube">0</div>
    <p>YouTube</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.instagram.com/fernando_daebot/')">
    <div class="num" id="instagram">0</div>
    <p>Instagram</p>
  </div>

</section>

<!-- PRODUCTOS -->
<section class="productos" id="catalogo">
  <h2>Catálogo</h2>

  <div class="card">
    Hombre 5cm - 15 Bs
    <button onclick="add('Hombre 5cm',15)">Agregar</button>
  </div>

  <div class="card">
    Mujer 5cm - 15 Bs
    <button onclick="add('Mujer 5cm',15)">Agregar</button>
  </div>

</section>

<!-- CARRITO -->
<section class="carrito">
  <h2>Pedido</h2>
  <ul id="lista"></ul>
  <p id="total">Total: 0 Bs</p>
  <button onclick="enviar()">Enviar WhatsApp</button>
</section>

<script>
let total = 0;
let texto = "";

function add(nombre, precio){
  total += precio;
  texto += nombre + " - " + precio + " Bs\n";
  document.getElementById("total").innerText = "Total: " + total + " Bs";
}

function enviar(){
  let url = "https://wa.me/59175404843?text=" + encodeURIComponent(texto);
  window.open(url);
}

/* DATOS EDITABLES */
const datos = {
  "tiktok": 18000,
  "facebook": 3000,
  "youtube": 630,
  "instagram": 42
};

/* ANIMACIÓN */
for (let red in datos) {
  let el = document.getElementById(red);
  let valor = datos[red];
  let count = 0;

  let subir = setInterval(() => {
    count += valor / 50;
    if (count >= valor) {
      count = valor;
      clearInterval(subir);
    }
    el.innerText = "+" + Math.floor(count);
  }, 20);
}

/* ABRIR LINKS */
function abrir(url){
  window.open(url, "_blank");
}
</script>

</body>
</html>
