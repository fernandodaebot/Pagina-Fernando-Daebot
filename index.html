<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fernando Daebot</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    /* NAVBAR */
    .nav {
      display: flex;
      justify-content: space-between;
      padding: 20px 50px;
      background: black;
    }

    .nav h2 {
      margin: 0;
    }

    /* HERO */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 80px;
    }

    .hero-text {
      max-width: 50%;
    }

    .hero-text h1 {
      font-size: 60px;
      margin: 0;
    }

    .hero-text span {
      color: red;
    }

    .hero-text p {
      color: #ccc;
      font-size: 18px;
      margin-top: 20px;
    }

    .buttons button {
      padding: 12px 20px;
      margin-right: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-main {
      background: red;
      color: white;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid white;
      color: white;
    }

    .hero-img {
      width: 400px;
      height: 250px;
      background: #222;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    /* PRODUCTOS */
    .productos {
      padding: 50px;
      background: #f5f5f5;
      color: black;
    }

    .productos h2 {
      text-align: center;
    }

    .grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 200px;
      text-align: center;
    }

    .card button {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #ff7ac6;
      color: white;
      cursor: pointer;
    }

    /* CARRITO */
    .carrito {
      padding: 40px;
      background: #222;
    }

    .carrito h2 {
      text-align: center;
    }

    #lista {
      margin-top: 20px;
    }

    .total {
      margin-top: 20px;
      font-size: 20px;
    }

    .whatsapp {
      margin-top: 20px;
      background: green;
      padding: 10px;
      border: none;
      color: white;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <!-- NAV -->
  <div class="nav">
    <h2>Fernando Daebot 🤖</h2>
    <div>Catálogo</div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h1>Domina tus <span>Termoformas</span></h1>

      <p>
        Creador, inventor y apasionado por el diseño creativo.
        Convierte tus ideas en moldes reales 🎨
      </p>

      <div class="buttons">
        <button class="btn-main">Ver catálogo</button>
        <button class="btn-secondary">Ver proyectos</button>
      </div>
    </div>

    <div class="hero-img">
      Aquí irá tu video o imagen
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="productos">
    <h2>🎨 Catálogo de Termoformas</h2>

    <div class="grid">

      <div class="card">
        <h3>🎭 Hombre</h3>
        <button onclick="add('Hombre 5cm',15)">5 cm - 15 Bs</button>
        <button onclick="add('Hombre 7cm',30)">7 cm - 30 Bs</button>
        <button onclick="add('Hombre 8cm',40)">8 cm - 40 Bs</button>
        <button onclick="add('Hombre 9cm',50)">9 cm - 50 Bs</button>
      </div>

      <div class="card">
        <h3>👩 Mujer</h3>
        <button onclick="add('Mujer 5cm',15)">5 cm - 15 Bs</button>
        <button onclick="add('Mujer 7cm',30)">7 cm - 30 Bs</button>
        <button onclick="add('Mujer 8cm',40)">8 cm - 40 Bs</button>
        <button onclick="add('Mujer 9cm',50)">9 cm - 50 Bs</button>
      </div>

    </div>
  </section>

  <!-- CARRITO -->
  <section class="carrito">
    <h2>🛒 Tu pedido</h2>

    <ul id="lista"></ul>

    <div class="total" id="total">Total: 0 Bs</div>

    <button class="whatsapp" onclick="enviar()">Enviar por WhatsApp</button>
  </section>

  <script>
    let total = 0;
    let texto = "";

    function add(nombre, precio) {
      let lista = document.getElementById("lista");

      let item = document.createElement("li");
      item.textContent = nombre + " - " + precio + " Bs";

      lista.appendChild(item);

      total += precio;
      document.getElementById("total").textContent = "Total: " + total + " Bs";

      texto += nombre + " - " + precio + " Bs\n";
    }

    function enviar() {
      let mensaje = "Hola quiero pedir:\n\n" + texto + "\nTotal: " + total + " Bs";

      let url = "https://wa.me/59175404843?text=" + encodeURIComponent(mensaje);
      window.open(url);
    }
  </script>

</body>
</html>
