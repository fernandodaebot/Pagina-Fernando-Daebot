<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>

.btn-pedido{
  background:red;
  color:white !important;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  font-size:18px;
  transition:0.3s;
}

/* efecto hover 🔥 */
.btn-pedido:hover{
background:#ff2a2a;
transform:scale(1.05);
}

.card{
background:#111;
border-radius:12px;
padding:15px;
text-align:center;
transition:0.3s;
cursor:pointer;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.card img{
width:100%;
border-radius:10px;
}

.card h3{
margin:10px 0;
font-weight:bold;
}

/* 🔥 EXPANSIÓN */
.expandir{
display:none;
margin-top:10px;
text-align:left;
}

.fila{
display:flex;
justify-content:space-between;
align-items:center;
margin:8px 0;
gap:15px; /* 🔥 ESTE ES EL CAMBIO IMPORTANTE */
}

.fila button{
background:red;
border:none;
color:white;
padding:5px 10px;
border-radius:6px;
cursor:pointer;
margin-left:10px; /* 🔥 separación del texto */
}
.contador{
font-size:14px;
color:#ccc;
margin-left:10px;
}

.menos{
background:#444;
}

.titulo{
color:red;
font-weight:bold;
}
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#0b0b0b;
color:white;
}
/* 🔥 TITULO CATALOGO */
.catalogo h2{
font-size:40px;
margin-bottom:10px;
}

.catalogo p{
color:#aaa;
margin-bottom:30px;
}

/* 🔥 BOTONES CATEGORIAS */
#filtros{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:30px;
}

#filtros button{
background:#1f1f1f;
border:none;
padding:10px 18px;
border-radius:20px;
color:white;
cursor:pointer;
transition:0.3s;
}

#filtros button:hover{
background:red;
}

#filtros button.active{
background:red;
}

/* 🔥 TARJETAS PRO */
.card{
background:#111;
border-radius:15px;
padding:15px;
text-align:left;
transition:0.3s;
border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

.card img{
height:160px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

/* 🔥 TEXTO TARJETA */
.card h4{
margin:5px 0;
}

.precio{
color:red;
font-weight:bold;
margin:10px 0;
}

/* 🔥 BOTON */
.card button{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #333;
background:transparent;
color:white;
cursor:pointer;
}

.card button:hover{
border-color:red;
}

/* NAV */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 40px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);

z-index:9999; /* 🔥 AGREGA ESTA LINEA */
}

.menu{
position:absolute;
left:50%;
transform:translateX(-50%);
display:flex;
gap:25px;
}

.menu a{
position:relative;
color:white;
text-decoration:none;
font-weight:800;
font-size:18px; /* 🔥 MÁS GRANDE */
padding:8px 12px;
}

/* línea animada */
.menu a::after{
content:"";
position:absolute;
bottom:-5px;
left:0;
width:0%;
height:3px;
background:red;
transition:0.3s;
}

.menu a:hover::after,
.menu a.active::after{
width:100%;
}

/* HERO */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:space-between;
padding:120px 80px;
background:
linear-gradient(to right, rgba(0,0,0,0.6), rgba(0,0,0,0.2)),
url("https://raw.githubusercontent.com/fernandodaebot/Pagina-Fernando-Daebot/main/fondo.png");
background-size:cover;
}

.hero h1{
font-size:65px;
font-weight:900;
margin:0;
}

.hero p{
color:#ccc;
margin-top:20px;
font-size:18px;
}

.btn-main{
background:red;
padding:14px 24px;
border:none;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

/* REDES */
.stats{
background:#000;
padding:60px;
display:flex;
justify-content:center;
gap:20px;
}

.stat-box{
background:#222;
padding:20px;
border-radius:10px;
cursor:pointer;
text-align:center;
transition:0.3s;
}

.stat-box:hover{
transform:scale(1.05);
}

.num{
font-size:32px;
color:red;
font-weight:bold;
}

/* CATALOGO */
.catalogo{
padding:60px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
gap:20px;
}

.card{
background:#111;
border-radius:10px;
padding:10px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
}

.detalles{
display:none;
margin-top:10px;
}

.carrito{
margin-top:30px;
background:#222;
padding:20px;
}
/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:10000;
}

.popup-contenido{
background:#111;
padding:20px;
border-radius:15px;
display:flex;
gap:20px;
max-width:800px;
width:90%;
position:relative;
}

.popup img{
width:300px;
border-radius:10px;
}

.cerrar{
position:absolute;
top:10px;
right:15px;
font-size:25px;
cursor:pointer;
color:white;
}
.categoria-bloque{
background:#1a1a1a; /* 🔥 fondo diferente */
border-radius:15px;
padding:25px;
margin:40px 0;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.categoria-titulo{
text-align:center;
font-size:38px;
color:red;
font-weight:900;
margin-bottom:20px;
letter-spacing:2px;
}

.categoria-grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
gap:20px;
}
.carrito{
margin-top:30px;
background:#181818;
padding:30px;
border-radius:15px;
max-width:600px;
margin-left:auto;
margin-right:auto;
}

/* cada producto */
.item-carrito{
background:#222;
padding:15px;
border-radius:12px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* info texto */
.item-info{
font-size:16px;
}

.item-info b{
font-size:18px;
}

/* botones grandes */
.controles{
display:flex;
align-items:center;
gap:10px;
}

.btn-cantidad{
background:red;
border:none;
color:white;
font-size:18px;
width:35px;
height:35px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn-cantidad.menos{
background:#444;
}

.cantidad-num{
font-size:18px;
font-weight:bold;
min-width:25px;
text-align:center;
}

/* total gigante */
.total-final{
text-align:center;
margin-top:20px;
font-size:28px;
font-weight:900;
}

.total-final span{
color:red;
font-size:32px;
}
.img-carrito{
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
}

.item-carrito{
background:#222;
padding:15px;
border-radius:12px;
margin-bottom:15px;
display:flex;
align-items:center;
gap:15px;
}
.btn-cantidad{
background:red;
color:white;
border:none;
width:35px;
height:35px;
font-size:20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

.btn-cantidad:hover{
transform:scale(1.1);
background:#ff2a2a;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<h2>Daebot 🤖</h2>
<div class="menu">
<a href="#inicio">Inicio</a>
<a href="#redes">Redes</a>
<a href="#catalogo">Catálogo</a>
<a href="#pedido" class="btn-pedido">🛒 MI Pedido</a>
</div>
</div>

<!-- HERO -->
<section class="hero" id="inicio">
<div>
<h1>Moldes de <span style="color:red">Goma Eva</span></h1>
<p>Crea fofuchas, figuras y manualidades increíbles 🚀</p>

<button class="btn-main" onclick="window.location.href='jonson/index.html'">
  Ver Catálogo
\</button>

</div>
</section>
<div class="popup" id="popup">
<div class="popup-contenido" id="popupContenido">
<span class="cerrar" onclick="cerrarPopup()">✖</span>
<img id="popupImg">
<div id="popupInfo"></div>
</div>
</div>
<!-- REDES -->
<section class="stats" id="redes">

<div class="stat-box" onclick="abrir('https://www.tiktok.com/@fernandodaebot')">
<div class="num" id="tiktok">0</div>
<p>TikTok</p>
</div>

<div class="stat-box" onclick="abrir('https://www.facebook.com/fernando.daebot')">
<div class="num" id="facebook">0</div>
<p>Facebook</p>
</div>

<div class="stat-box" onclick="abrir('https://www.youtube.com/@FernandoDaebot')">
<div class="num" id="youtube">0</div>
<p>YouTube</p>
</div>

<div class="stat-box" onclick="abrir('https://www.instagram.com/fernando_daebot')">
<div class="num" id="instagram">0</div>
<p>Instagram</p>
</div>

</section>

<!-- CATALOGO -->
<section class="catalogo" id="catalogo">

<h2>Catálogo de Termoformas</h2>
<p>Encuentra moldes, kits y accesorios para tus proyectos</p>

<div id="filtros"></div>
<div id="productos"></div>

<div class="carrito" id="pedido">
<h2 style="
text-align:center;
font-size:28px;
font-weight:900;
margin-bottom:20px;
">
🛒 Tu Pedido
</h2>
<ul id="listaCarrito"></ul>
<h2 style="margin-top:20px;">Total: <span id="total">0</span></h2>
</div>

</section>

<script>
const preciosMascaras = {
  "Mascara de Oso": { unidad:200, pack3:180, pack6:165, tamaños:"11cm, 9cm, 7cm" },
  "Mascara de Morenada": { unidad:170, pack3:155, pack6:135, tamaños:"11cm, 9cm, 7cm" },
  "Mascara de Tobas": { unidad:170, pack3:150, pack6:130, tamaños:"8cm, 7cm, 6cm" },
  "Mascara de Pepino": { unidad:170, pack3:155, pack6:135, tamaños:"9cm, 5cm, 6cm" },
  "Mascara de Diablo": { unidad:230, pack3:215, pack6:200, tamaños:"12cm, 11cm, 9cm" },
  "Mascara de Diabla": { unidad:200, pack3:180, pack6:165, tamaños:"11cm, 10cm, 7cm" }
};
  
let carrito = [];

/* 🔥 CARGAR PRODUCTOS */
fetch("jonson/productos.json")
.then(res => res.json())
.then(data => mostrarProductos(data));

function mostrarProductos(lista){

const contenedor = document.getElementById("productos");
contenedor.innerHTML = "";

let categorias = {};

// AGRUPAR
lista.forEach(p=>{
if(!categorias[p.categoria]){
categorias[p.categoria] = [];
}
categorias[p.categoria].push(p);
});

// RECORRER
for(let cat in categorias){

// 🔴 BLOQUE
let bloque = document.createElement("div");

bloque.className = "categoria-bloque";
bloque.style.width = "100%";

// 🔴 TITULO GRANDE

let titulo = document.createElement("h2");
titulo.className = "categoria-titulo";
titulo.innerText = cat.toUpperCase();
titulo.style = `
text-align:center;
font-size:36px;
margin:50px 0 20px;
color:red;
font-weight:bold;
`;

bloque.appendChild(titulo);

// 🔴 GRID

let grid = document.createElement("div");
grid.className = "categoria-grid";

categorias[cat].forEach(p=>{
  let card = document.createElement("div");
  card.className = "card";

card.innerHTML = `
    <img src="${p.imagen}">
    <h3>${p.nombre}</h3>
`;

  card.onclick = ()=>abrirPopup(p);

  grid.appendChild(card);
});

bloque.appendChild(grid);
contenedor.appendChild(bloque);

}
}
/* 🛒 CARRITO */
function agregar(nombre, opcion, precio, imagen, categoria){
  carrito.push({nombre, opcion, precio, imagen, categoria});
  actualizarCarrito();
}
function sumarItem(nombre, opcion, precio){
let item = carrito.find(x => x.nombre === nombre && x.opcion === opcion);
if(item){
carrito.push({...item});
}
actualizarCarrito();
}

function restarItem(nombre, opcion){
let index = carrito.findIndex(x => x.nombre === nombre && x.opcion === opcion);
if(index > -1){
carrito.splice(index,1);
}
actualizarCarrito();
}

let contador = {};

function actualizarCarrito(){

let lista = document.getElementById("listaCarrito");
let total = document.getElementById("total");

lista.innerHTML = "";
let suma = 0;
contador = {};

// 🔥 AQUÍ VA (correcto)
let totalAlfabetos = 0;

carrito.forEach((item)=>{
  let key = item.nombre + "-" + item.opcion;

  if(!contador[key]){
    contador[key] = { ...item, cantidad: 0 };
  }

  contador[key].cantidad++;

  // 🔥 CONTAR ALFABETOS
  if(item.categoria === "alfabetos"){
    totalAlfabetos++;
  }
});
let precioAlfabeto = 140;

if(totalAlfabetos >= 6){
  precioAlfabeto = 100;
}else if(totalAlfabetos >= 3){
  precioAlfabeto = 120;
}
  
Object.values(contador).forEach(item => {

let cantidadReal = item.cantidad;

// si es kit (ej: "3 Kit")
if(item.opcion && item.opcion.includes("Kit")){
let num = parseInt(item.opcion) || 1;
cantidadReal = item.cantidad * num;
}

let precioFinal = item.precio;

// 🔥 SI ES ALFABETO → usar precio dinámico
if(item.categoria === "alfabetos"){
  precioFinal = precioAlfabeto;
}

let subtotal = precioFinal * cantidadReal;
suma += subtotal;

lista.innerHTML += `
<div class="item-carrito">

  \<img src="${item.imagen}" class="img-carrito">

  \<div class="item-info">
    \<b>${item.nombre}\</b>\<br>
    ${item.opcion}\<br>
    \<small>Total unidades: ${cantidadReal}\</small>\<br>
    <b>${subtotal} Bs</b><br>
<small>
${item.categoria === "alfabetos" 
  ? `Precio aplicado: ${precioAlfabeto} Bs`
  : ""}
</small>
  \</div>

  \<div class="controles">
    \<button class="btn-cantidad" onclick="restarItem('${item.nombre}','${item.opcion}')">−\</button>

    \<span class="cantidad-num">${item.cantidad}\</span>

    \<button class="btn-cantidad" onclick="sumarItem('${item.nombre}','${item.opcion}',${item.precio})">+\</button>
  \</div>

\</div>

`;
});

total.innerHTML = `
<div class="total-final">
TOTAL: <span>${suma} Bs</span>
</div>
`;
}
let cantidades = {};

function abrirPopup(p){
document.getElementById("popup").style.display = "flex";
document.getElementById("popupImg").src = p.imagen;

let contenido = `<h2>${p.nombre}</h2>`;

if(p.categoria === "alfabetos"){

  contenido += `
<p class="titulo">Tamaños de Kit</p>
<p style="color:#aaa">${m.tamaños}</p>

<p class="titulo">Precios</p>

${crearFila(p,"1 Kit",m.unidad)}
${crearFila(p,"3 Kits",m.pack3)}
${crearFila(p,"6 Kits",m.pack6)}
`;
}else if(p.categoria === "mascaras"){

  let m = preciosMascaras[p.nombre];

  if(m){
    contenido += `
    <p class="titulo">Tamaños</p>
    <p style="color:#aaa">${m.tamaños}</p>

    <p class="titulo">Precios</p>

    ${crearFila(p,"Unidad",m.unidad)}
    ${crearFila(p,"3 Kits",m.pack3)}
    ${crearFila(p,"6 Kits",m.pack6)}
    `;
  }else{
    contenido += `<p style="color:red;">Error: máscara sin configuración</p>`;
  }

}else{

  contenido += `
  <p class="titulo">Precio Por Suelto</p>

  ${crearFila(p,"8cm",35)}
  ${crearFila(p,"6cm",23)}
  ${crearFila(p,"4cm",13)}

  <hr>

  <p class="titulo">Kit</p>

  ${crearFila(p,"1 Kit",65)}
  ${crearFila(p,"3 Kit",60)}
  ${crearFila(p,"6 Kit",55)}
  `;
}

document.getElementById("popupInfo").innerHTML = contenido;
}

function crearFila(p, opcion, precio){
return `
<div class="fila">
  ${opcion} - ${precio} Bs

  <button onclick="sumar(this,'${p.nombre}','${opcion}',${precio},'${p.categoria}')">Comprar</button>

  <span class="contador" style="display:none;" data-cantidad="0"></span>

  <button class="menos" style="display:none;" onclick="restar(this,'${p.nombre}','${opcion}',${precio})">-</button>
</div>
`;
}
function sumar(btn, nombre, opcion, precio, categoria){
let fila = btn.parentElement;

let contador = fila.querySelector(".contador");
let menos = fila.querySelector(".menos");

let cantidad = parseInt(contador.dataset.cantidad || 0);
cantidad++;

// ✅ AQUÍ ESTÁ LA SOLUCIÓN
let img = document.getElementById("popupImg").src;

agregar(nombre, opcion, precio, img, categoria);

contador.dataset.cantidad = cantidad;
contador.innerText = "Tienes " + cantidad;

contador.style.display = "inline";
menos.style.display = "inline";
}
function restar(btn, nombre, opcion, precio){
let fila = btn.parentElement;
let contador = fila.querySelector(".contador");

let cantidad = parseInt(contador.dataset.cantidad || 0);

if(cantidad > 0){
cantidad--;

for(let i=carrito.length-1;i>=0;i--){
  if(carrito[i].nombre==nombre && carrito[i].opcion==opcion){
    carrito.splice(i,1);
    break;
  }
}

actualizarCarrito();
}

if(cantidad <= 0){
contador.style.display = "none";
btn.style.display = "none";
contador.dataset.cantidad = 0;
contador.innerText = "";
}else{
contador.dataset.cantidad = cantidad;
contador.innerText = "Tienes " + cantidad;
}
}
function actualizarCantidad(key){
let el = document.getElementById("cant_"+key);
if(el){
el.innerText = cantidades[key] || 0;
}
}

function cerrarPopup(){
document.getElementById("popup").style.display = "none";
}

window.onclick = function(e){
let popup = document.getElementById("popup");
if(e.target === popup){
cerrarPopup();
}
}

function comprarBtn(btn){
let count = btn.getAttribute("data-count") || 0;
count++;

btn.setAttribute("data-count", count);

btn.style.background = "red";
btn.style.color = "white";
btn.innerText = "Agregado (" + count + ")";
}
/* 🔗 REDES */
function abrir(url){
window.open(url, "_blank");
}

/* 🔥 CONTADOR ANIMADO */
const datos = {
tiktok:18000,
facebook:3000,
youtube:630,
instagram:42
};

function formatear(n){
return n>=1000 ? (n/1000).toFixed(0)+"K" : n;
}

window.onload = ()=>{
for(let red in datos){
let el = document.getElementById(red);
if(!el) continue;

let val = datos[red];
let c = 0;

let i = setInterval(()=>{
  c += val/40;

  if(c >= val){
    c = val;
    clearInterval(i);
  }

  el.innerText = "+" + formatear(Math.floor(c));
},20);

}
};
</script>
</body>
</html>
