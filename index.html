<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0b0b0b;
  color:white;
}

/* NAV */
.nav{
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 40px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

.menu{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

.menu a{
  margin:0 15px;
  text-decoration:none;
  color:white;
  font-weight:bold;
  padding-bottom:5px;
}

.menu a.active{
  color:red;
  border-bottom:2px solid red;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:120px 80px;

  /* 🔥 fondo tipo Erexit */
  background:
    linear-gradient(to right, rgba(0,0,0,0.95), rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1581090700227-1e8a0b2f5d4f");

  background-size:cover;
  background-position:center;
}

/* TEXTO */
.hero-text{
  max-width:50%;
}

.hero-text h1{
  font-size:70px;
  margin:0;
  line-height:1.1;
}

.hero-text .rojo{
  color:red;
}

.hero-text p{
  color:#ccc;
  margin-top:20px;
  font-size:18px;
}

/* BOTONES */
.buttons{
  margin-top:30px;
}

.buttons button{
  padding:14px 24px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}

.btn-main{
  background:red;
  color:white;
}

.btn-secondary{
  background:transparent;
  border:1px solid #444;
  color:white;
}

/* VIDEO */
.video{
  width:460px;
  height:260px;
  background:#111;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.video iframe{
  width:100%;
  height:100%;
  border:none;
}

/* SECCIÓN REDES (bloque separado) */
.stats{
  background:#000;
  padding:80px 20px;
  display:flex;
  justify-content:center;
  gap:25px;
}

.stat-box{
  background:#2a2a2a;
  padding:18px 12px;
  border-radius:12px;
  width:140px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.stat-box:hover{
  background:#3a3a3a;
  transform:scale(1.05);
}

.num{
  font-size:42px;
  color:red;
  font-weight:bold;
}

.stat-box p{
  margin-top:10px;
  font-weight:bold;
  font-size:18px;
}

/* CATÁLOGO */
.productos{
  padding:60px;
  background:white;
  color:black;
  text-align:center;
}

/* SCROLL */
section{
  scroll-margin-top:100px;
}

/* 📱 RESPONSIVE */
@media (max-width: 768px){

  .hero{
    flex-direction:column;
    text-align:center;
    padding:120px 20px;
  }

  .hero-text{
    max-width:100%;
  }

  .hero-text h1{
    font-size:42px;
  }

  .video{
    width:100%;
    margin-top:30px;
  }

  .menu{
    position:static;
    transform:none;
    text-align:center;
    margin-top:10px;
  }

}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Fernando Daebot 🤖</h2>

  <div class="menu">
    <a href="#inicio" class="active">Inicio</a>
    <a href="#redes">Redes</a>
    <a href="#catalogo">Catálogo</a>
  </div>
</div>

<!-- HERO -->
<section class="hero" id="inicio">

  <div class="hero-text">
    <h1>
      Domina la <br>
      <span class="rojo">Impresión 3D</span>
    </h1>

    <p>
      Creador de termoformas y proyectos creativos 🚀
    </p>

    <div class="buttons">
      <button class="btn-main">Comenzar</button>
      <button class="btn-secondary">Ver más</button>
    </div>
  </div>

  <!-- VIDEO -->
  <div class="video">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
  </div>

</section>

<!-- REDES -->
<section class="stats" id="redes">

  <div class="stat-box" onclick="abrir('https://www.tiktok.com/@fernandodaebot')">
    <div class="num" id="tiktok">0</div>
    <p>TikTok</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.facebook.com/fernando.daebot')">
    <div class="num" id="facebook">0</div>
    <p>Facebook</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.youtube.com/@FernandoDaebot')">
    <div class="num" id="youtube">0</div>
    <p>YouTube</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.instagram.com/fernando_daebot')">
    <div class="num" id="instagram">0</div>
    <p>Instagram</p>
  </div>

</section>

<!-- CATÁLOGO -->
<section class="productos" id="catalogo">
  <h2>🎨 Catálogo</h2>
  <p>Aquí irá tu tienda de termoformas 👀</p>
</section>

<script>

/* DATOS */
const datos = {
  tiktok: 18000,
  facebook: 3000,
  youtube: 630,
  instagram: 42
};

/* FORMATO K */
function formatear(num){
  if(num >= 1000){
    return (num/1000).toFixed(0) + "K";
  }
  return num;
}

/* ANIMACIÓN */
for(let red in datos){
  let el = document.getElementById(red);
  let valor = datos[red];
  let count = 0;

  let subir = setInterval(()=>{
    count += valor / 50;

    if(count >= valor){
      count = valor;
      clearInterval(subir);
    } 

    el.innerText = "+" + formatear(Math.floor(count));
  },20);
}

/* LINKS */
function abrir(url){
  window.open(url, "_blank");
}

/* MENU ACTIVO */
const sections = document.querySelectorAll("section");
const links = document.querySelectorAll(".menu a");

window.addEventListener("scroll", ()=>{
  let current = "";

  sections.forEach(sec=>{
    if(pageYOffset >= sec.offsetTop - 120){
      current = sec.id;
    }
  });

  links.forEach(a=>{
    a.classList.remove("active");
    if(a.getAttribute("href") == "#" + current){
      a.classList.add("active");
    }
  });
});

</script>

</body>
</html>
