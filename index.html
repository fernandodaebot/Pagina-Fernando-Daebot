<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fernando Daebot</title>

<style>

/* GENERAL */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0b0b0b;
  color: white;
  padding-top: 70px;
}

/* NAVBAR */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 40px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  z-index: 1000;
}

/* MENU */
.menu a {
  margin-left: 30px;
  text-decoration: none;
  color: #ccc;
  font-size: 18px;
  font-weight: bold;
  position: relative;
}

/* HOVER */
.menu a:hover {
  color: white;
}

/* LINEA ROJA */
.menu a::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 0%;
  height: 2px;
  background: red;
  transition: 0.3s;
}

.menu a:hover::after {
  width: 100%;
}

.menu a.active {
  color: white;
}

.menu a.active::after {
  width: 100%;
}

/* HERO */
.hero {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 70vh;
  text-align: center;
}

.hero h1 {
  font-size: 70px;
}

.hero span {
  color: red;
}

/* REDES */
.stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 60px;
  flex-wrap: wrap;
}

.stat-box {
  background: #2a2a2a;
  padding: 18px 10px;
  border-radius: 12px;
  width: 140px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
}

.stat-box:hover {
  background: #3a3a3a;
  transform: scale(1.05);
}

.stat-box p {
  font-size: 20px;
  font-weight: bold;
}

.num {
  font-size: 42px;
  color: red;
  font-weight: bold;
}

/* PRODUCTOS */
.productos {
  background: white;
  color: black;
  padding: 50px;
  text-align: center;
}

.card {
  background: #eee;
  padding: 20px;
  margin: 10px;
  display: inline-block;
}

/* CARRITO */
.carrito {
  padding: 40px;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <h2>Daebot 🤖</h2>
  <div class="menu">
    <a href="#inicio" class="active">Inicio</a>
    <a href="#redes">Redes</a>
    <a href="#catalogo">Catálogo</a>
  </div>
</div>

<!-- HERO -->
<section class="hero" id="inicio">
  <div>
    <h1>Fernando <span>Daebot</span></h1>
    <p>Creador de termoformas 🚀</p>
  </div>
</section>

<!-- REDES -->
<section class="stats" id="redes">

  <div class="stat-box" onclick="abrir('https://www.tiktok.com/@fernandodaebot')">
    <div class="num" id="tiktok">0</div>
    <p>TikTok</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.facebook.com/fernando.daebot')">
    <div class="num" id="facebook">0</div>
    <p>Facebook</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.youtube.com/@FernandoDaebot')">
    <div class="num" id="youtube">0</div>
    <p>YouTube</p>
  </div>

  <div class="stat-box" onclick="abrir('https://www.instagram.com/fernando_daebot/')">
    <div class="num" id="instagram">0</div>
    <p>Instagram</p>
  </div>

</section>

<!-- PRODUCTOS -->
<section class="productos" id="catalogo">
  <h2>Catálogo</h2>

  <div class="card">
    Hombre 5cm - 15 Bs
    <button onclick="add('Hombre 5cm',15)">Agregar</button>
  </div>

  <div class="card">
    Mujer 5cm - 15 Bs
    <button onclick="add('Mujer 5cm',15)">Agregar</button>
  </div>

</section>

<!-- CARRITO -->
<section class="carrito">
  <h2>Pedido</h2>
  <ul id="lista"></ul>
  <p id="total">Total: 0 Bs</p>
  <button onclick="enviar()">Enviar WhatsApp</button>
</section>

<script>

/* SCROLL NAV EFECTO */
window.addEventListener("scroll", () => {
  const nav = document.querySelector(".nav");

  if (window.scrollY > 50) {
    nav.style.background = "rgba(0,0,0,0.8)";
  } else {
    nav.style.background = "rgba(0,0,0,0.6)";
  }
});

/* MENU ACTIVO */
const sections = document.querySelectorAll("section");
const navLinks = document.querySelectorAll(".menu a");

window.addEventListener("scroll", () => {
  let current = "";

  sections.forEach(section => {
    const sectionTop = section.offsetTop;
    if (pageYOffset >= sectionTop - 100) {
      current = section.getAttribute("id");
    }
  });

  navLinks.forEach(a => {
    a.classList.remove("active");
    if (a.getAttribute("href") === "#" + current) {
      a.classList.add("active");
    }
  });
});

/* CARRITO */
let total = 0;
let texto = "";

function add(nombre, precio){
  total += precio;
  texto += nombre + " - " + precio + " Bs\n";
  document.getElementById("total").innerText = "Total: " + total + " Bs";
}

function enviar(){
  let url = "https://wa.me/59175404843?text=" + encodeURIComponent(texto);
  window.open(url);
}

/* LINKS */
function abrir(url){
  window.open(url, "_blank");
}

/* DATOS EDITABLES */
const datos = {
  "tiktok": 18000,
  "facebook": 3000,
  "youtube": 630,
  "instagram": 42
};

/* FORMATO K */
function formatear(num) {
  if (num >= 1000) {
    return (num / 1000).toFixed(0) + "K";
  }
  return num;
}

/* ANIMACIÓN */
for (let red in datos) {
  let el = document.getElementById(red);
  let valor = datos[red];
  let count = 0;

  let subir = setInterval(() => {
    count += valor / 50;

    if (count >= valor) {
      count = valor;
      clearInterval(subir);
    }

    el.innerText = "+" + formatear(Math.floor(count));

  }, 20);
}

</script>

</body>
</html>
